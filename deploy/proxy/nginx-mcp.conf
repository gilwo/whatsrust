# nginx: TLS reverse proxy for the whatsrust MCP listener (WHATSRUST_MCP_PORT).
# Use: put this file in nginx's http context (e.g. /etc/nginx/conf.d/mcp.conf), set the domain and
# the certificate paths, run `nginx -t && nginx -s reload`. Tested by scripts/mcp-proxy-smoke.sh.
# The daemon stays bound to loopback (WHATSRUST_MCP_BIND=127.0.0.1, the default); this proxy
# rewrites Host to 127.0.0.1, so no WHATSRUST_ALLOWED_HOSTS is needed. Needs nginx 1.25.1 or newer
# for `http2 on;`; on older versions write `listen 443 ssl http2;` instead.
# Keep request buffering at its default (on): the listener needs a Content-Length and answers 411
# to a chunked body, and nginx always sends a buffered body with a Content-Length.

upstream mcp_backend {
    server 127.0.0.1:7271;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;

    # 10M is 10 MiB, the largest request the listener accepts.
    client_max_body_size 10M;

    # Only /mcp is forwarded; the listener serves nothing else.
    location = /mcp {
        proxy_pass http://mcp_backend;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
