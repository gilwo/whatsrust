[package]
name = "whatsrust-embedder"
version = "0.1.0"
edition = "2021"
description = "Native Rust embedder sidecar for whatsrust using candle"
license = "MIT"

[[bin]]
name = "whatsrust-embedder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt"] }

# HuggingFace ecosystem
hf-hub = "0.3"
tokenizers = "0.23"
# Direct dependency (not just transitive via hf-hub): used to fetch files
# ourselves when hf-hub's own Api::download() can't (see the "HuggingFace
# Hub resolution helpers" comment in src/main.rs for why). Same version/TLS
# backend hf-hub 0.3 already pulls in, so this doesn't add a second stack.
ureq = { version = "2", features = ["native-tls"] }

# Candle for ML inference
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
